name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "LivePhotoMaker/**"
      - "Config/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project LivePhotoMaker.xcodeproj \
            -scheme LivePhotoMaker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/Build/Products/Release-iphoneos/LivePhotoMaker.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "构建产物不存在：$APP_PATH"
            exit 1
          fi
          if [[ ! -f "$APP_PATH/LivePhotoMaker" ]]; then
            echo "可执行文件缺失：$APP_PATH/LivePhotoMaker"
            exit 1
          fi

          PLIST="$APP_PATH/Info.plist"

          # 相册权限描述必须存在：代码里用到 PHPhotoLibrary(.readWrite) 与 PHAsset 查询，
          # 缺 NSPhotoLibraryUsageDescription 会在真机请求授权时崩溃。
          add_str() {
            local key="$1" val="$2"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "$key already present"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string $val" "$PLIST"
              echo "$key added"
            fi
          }
          add_str "NSPhotoLibraryUsageDescription" "用于读取你选择的照片与视频以配对生成实况照片。"
          add_str "NSPhotoLibraryAddUsageDescription" "用于将合成后的实况照片保存到你的系统相册。"

          # 强制写入 open-in-place / iTunes 文件共享两个键，避免 Info.plist 未注入时
          # 文件选择器无法选择文件夹（历史问题根因）。
          for KEY in LSSupportsOpeningDocumentsInPlace UIFileSharingEnabled; do
            if /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$KEY true" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :$KEY bool true" "$PLIST"
            fi
            echo "$KEY = $(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST")"
          done

          echo "--- Info.plist 关键键校验 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"

          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload dist/LivePhotoMaker-unsigned.ipa

          # 用 sed 截断，避免 head 提前关闭管道触发 SIGPIPE（set -o pipefail 下会判为失败）。
          unzip -l dist/LivePhotoMaker-unsigned.ipa | sed -n '1,30p'
          shasum -a 256 dist/LivePhotoMaker-unsigned.ipa
          ls -lh dist/LivePhotoMaker-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoMaker-unsigned-ipa
          path: dist/LivePhotoMaker-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
